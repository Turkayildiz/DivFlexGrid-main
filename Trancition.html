<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <style>
    /* 
    CSS'de Transition ile Geçiş Efekti 
     */
     #mytransition{
        width: 100px;
        height: 100px;
        background: red;
    
    /*Buradaki ifade de width ile genislige uygulanacagini gosterir.
      suresi de 2s => 2 saniye  olacak sekilde uygular 
      bu degeri ms=> milisaniye olarak da ifade edebiliriz
    Burada alabilecegi özellikler
    transition
    transition-delay
    transition-duration
    transition-property
    transition-timing-function
    
      */
        transition: width 2s ;
        transition: height 1s; 
        /* transition-duration: 1500ms; */
        /* transition-timing-function:cubic-bezier(0.1, 1, 1.0, 0.1) ; */
        /* transition-timing-function:ease-out; */
    }
     #mytransition:hover{
        width: 300px;
        height: 300px;
     }

.liquid-morph-container {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: #001;
}

.liquid-morph-element {
  width: 250px;
  height: 100px;
  background: #0a2342;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  border-radius: 50px;
  overflow: hidden;
  transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

.liquid-morph-element span {
  color: #fff;
  font-size: 1.5rem;
  position: relative;
  z-index: 2;
}

.liquid-morph-element::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: conic-gradient(
    #0ff 0deg, 
    #0a2342 120deg, 
    #0ff 240deg
  );
  transition: all 0.6s ease;
  opacity: 0;
  transform: scale(0);
}

.liquid-morph-element:hover {
  border-radius: 10px;
  transform: rotate(15deg);
}

.liquid-morph-element:hover::before {
  opacity: 0.5;
  transform: scale(2);
}

   </style>
</head>
<body>
    <h1> Transition Ozelligi</h1>
    <p>Geçiş efektini gormek icin div ogesi uzerine geliniz</p>
    <div id="mytransition">Lorem ipsum dolor sit amet.</div>


    <div class="liquid-morph-container">
        <div class="liquid-morph-element">
          <span>TRANSFORM</span>
        </div>
      </div>
</body>
</html>
