<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
        }
        .navbar{
            overflow: hidden;
            background-color: #333;
        }
        .navbar a{
            float: left;
            color:#f2f2f2;
            display: block;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;

        }
        
        p{
            color:burlywood;
            font-size:40px;
        }
        @media screen and (max-width: 1000px){
            p{
                color:red;
                font-size:20px;
            }
        }   
        @media screen and (max-width: 700px){
            p{
                color:chartreuse;
                font-size:20px;
            }
        }
        @media screen and (max-width: 500px){
            p{
            color:darkorange;
            font-size:20px;
            }
            .navbar a{
                float: none;
                width: 100%;
            }  
        }
    </style>
</head>
<body>
    <h4>Ekran cozunurlugu ile iglili durumlar </h4>
    <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit.</p>

<div class="navbar">
    <a href="#">Link</a>
    <a href="#">Link</a>
    <a href="#">Link</a>
    <a href="#">Link</a>

</div>
</body>
</html>
