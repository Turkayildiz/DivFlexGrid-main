<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 
    <meta> etiketi, arama motorlarına bir web sitesi hakkında bilgi sağlayan HTML etiketidir. 
    Meta veriler ise sayfanızdaki verilerle ilgili bilgilerdir.
    
    <meta> etiketleri her zaman <head> etiketleri arasında bulunur. 
    Genellikle karakter kümesini, sayfa açıklamasını, anahtar sözcükleri, 
    belgenin yazarını ve görünüm penceresi ayarlarını belirtmek için kullanılır. 
    Meta veriler diğer HTML etiketlerinin aksine sayfada görünmez. 
    Bu veriler, tarayıcılar (içeriğin görünümü ve sayfanın yeniden yüklenme durumu), 
    arama motorları (anahtar kelimeler) ve diğer web hizmetleri tarafından kullanılır.

    meta etiketinin kullanımı  
1- Sayfa düzeyinde meta veriler için:

<meta name=“keywords” content=“HTML, CSS, JavaScript”>

2- Web sitesi açıklaması için:

<meta name=“description” content=“Free Web tutorials for HTML and CSS”>

3- Sayfanın yazarını belirtmek için:

<meta name=“author” content=“John Doe”>

4- Belgeyi her 30 saniyede bir yenilemek için:

<meta http-equiv=“refresh” content=“30”>

5- Web sitesinin tüm cihazlarda iyi görünmesini sağlamak ve görünüm alanını ayarlamak 
için

<meta name=“viewport” content=“width=device-width, initial-scale=1.0”>

Aslında meta etiketler içerisinde bulunduğumuz zaman diliminde sayfa sıralaması açısından 
minimum etkiye sahiptir, fakat arama motoru sonuçlarında açıklama meta etiketleri gözüktüğü 
için tıklanma oranlarında yardımcı olmaya devam etmektedir. 
Meta etiketlerini kısa ve net bir şekilde oluşturmamız gerekir. 

Aynı zamanda aynı meta etiketlerini farklı sayfalarda kullanmamalı ve bu etiketleri 
çoğaltmamalıyız.

Şimdi diğer bir sorumuz olan başlangıç değerinin neden 1.0 olduğuna gelelim. 
initial-scale, sayfanız web tarayıcısı tarafından ilk yüklendiğinde ilk yakınlaştırma düzeyi 
ile ilgilidir. initial-scale = 1.0 ise sayfanız yüklendiğinde herhangi bir yakınlaştırma 
durumu oluşmayacaktır. Eğer bunu 2.0 yaparsanız sayfada yakınlaştırma durumu meydana gelecektir.

ViewPort Etiketi
Viewport (Viewport alanı), bir web sayfasının kullanıcı tarafından görüntülenebilir olan 
bölümüne verilen isimdir. Kullanıcının cihazlara göre web sayfasında görüntülediği alanı 
kontrol etmek için kullanılan Viewport etiketi, tarayıcıya bir mobil cihazda
web sayfasının nasıl oluşturulacağının belirtildiği meta etiketidir. 
Bu etiketin HTML dokümanı içerisindeki varlığı, Google’a sayfanın mobil uyumlu olduğunu gösterir.


    -->
    <meta http-equiv="refresh" content="3">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>
   <h4>Lorem ipsum dolor, sit amet consectetur adipisicing elit.</h4> 
</body>
</html>
