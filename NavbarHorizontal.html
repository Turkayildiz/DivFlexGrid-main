<!DOCTYPE html>
<html>
<head>
<style>
ul {
  list-style-type: none;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color: #333;
}

li {
  float: left;
}

li a {
  display: block;
  color: white;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
}

li a:hover {
  background-color: #111;
}
.active {
  background-color: #04AA6D;
}
.loginForm{
    display: flex;
}
.loginContainer form 
{
    display: flex;
    gap:10px;
}
.loginContainer form label{
    margin-right: 7px;
}
.form-group{
    display:flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
}
</style>
</head>
<body>

<ul>
  <li><a class="active" href="#home">Home</a></li>
  <li><a href="#news">News</a></li>
  <li><a href="#contact">Contact</a></li>
  <li><a href="#about">About</a></li>
  <li style="float: right;">
    <div class="loginContainer">
        <form action="">
            <div class="form-group">
                <label for="email"><img src="icons8-email-24.png" alt=""></label>
                <input type="email" id="email" placeholder="john@sample.com">
            </div>
            <div class="form-group">
                <label for="password"><img src="icons8-password-24.png" alt=""></label>
                <input type="password" id="password">
            </div>
            <div class="form-group">
                <button type="submit"><i class="fa-solid fa-right-to-bracket"></i>Login</button>
            </div>
        </form>
    </div>
</li>
</ul>

</body>
</html>
